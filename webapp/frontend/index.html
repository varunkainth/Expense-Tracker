<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#292266" />
    <meta name="description" content="Your personal expense workspace. Records stay in this browser." />
    <script>
      // Apply the saved preference before styles paint. Keep the key in sync with theme.ts.
      (() => {
        let mode = 'system';
        try { mode = localStorage.getItem('expense-tracker.theme') || 'system'; } catch {}
        const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Expense Tracker · Your workspace</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
